# /etc/nginx/sites-available/smartsearch-api
# Symlink: ln -s /etc/nginx/sites-available/smartsearch-api /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name SmartSearchapi.culturemind.org;

    # Let Certbot handle HTTPS redirect after running:
    # sudo certbot --nginx -d SmartSearchapi.culturemind.org
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name SmartSearchapi.culturemind.org;

    # SSL certificates managed by Certbot (filled in automatically)
    ssl_certificate     /etc/letsencrypt/live/SmartSearchapi.culturemind.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SmartSearchapi.culturemind.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options            "DENY"                            always;
    add_header X-Content-Type-Options     "nosniff"                         always;
    add_header X-XSS-Protection           "1; mode=block"                   always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;

    # Tell Django it's behind HTTPS
    proxy_set_header X-Forwarded-Proto https;

    # Django static files served by WhiteNoise via Gunicorn
    location /static/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Django API
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
